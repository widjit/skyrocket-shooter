// ---------------------------------------------------------------------------
// TAK.gov third-party pipeline layout (follows the ATAK-CIV 5.6.0 SDK plugintemplate).
// The ATAK SDK is resolved ONLY through the TPC gradle plugin atak-gradle-takdev:
//   * Remote (pipeline / USG developers):
//       ./gradlew -Ptakrepo.force=true -Ptakrepo.url=https://artifacts.tak.gov/artifactory/maven \
//                 -Ptakrepo.user=<user> -Ptakrepo.password=<pass> assembleCivRelease
//     (the same keys may live in local.properties) -> com.atakmap.gradle:atak-gradle-takdev:3.+
//   * Offline (local dev): copy atak-gradle-takdev.jar, main.jar and android_keystore from the
//     tak.gov SDK zip into sdk/<atakVersion>/ (git-ignored). Override the folder with
//     -Psdk.path=<dir> and the plugin jar with -Ptakdev.plugin=<jar>.
//   * Neither available: -PallowStubs compiles against :atak-sdk-stubs (NOT a runnable APK).
// ATAK 4.x (legacy transapps plugin model) is built from tag v1.0.0-civ4.6.0 (commit fc397d0).
// ---------------------------------------------------------------------------
buildscript {
    def readLocal = { String key ->
        def f = rootProject.file('local.properties')
        if (!f.isFile()) return null
        def p = new Properties()
        f.withReader { p.load(it) }
        return p.getProperty(key)
    }
    def getProp = { String name, def dflt ->
        def v = project.properties[name] ?: readLocal(name)
        return v == null ? dflt : v
    }
    def ver = rootProject.ext.atakVersion
    def remoteUrl = getProp('takrepo.url', null)
    // Names below are the ones atak-gradle-takdev reads from the build script (as in the template)
    ext.isDevKitEnabled = { -> remoteUrl != null }
    ext.takrepoUrl = remoteUrl ?: 'https://localhost/'
    ext.takrepoUser = getProp('takrepo.user', 'invalid')
    ext.takrepoPassword = getProp('takrepo.password', 'invalid')
    ext.takdevJar = rootProject.file(getProp('takdev.plugin', "sdk/${ver}/atak-gradle-takdev.jar"))
    ext.takdevPlugin = takdevJar.absolutePath
    ext.takdevMode = remoteUrl != null ? 'remote' : (takdevJar.isFile() ? 'offline' : 'none')

    repositories {
        google()
        mavenCentral()
        if (remoteUrl != null) {
            maven {
                url = takrepoUrl
                credentials {
                    username = takrepoUser
                    password = takrepoPassword
                }
            }
        }
    }
    dependencies {
        if (takdevMode == 'remote') {
            classpath 'com.atakmap.gradle:atak-gradle-takdev:3.+'
        } else if (takdevMode == 'offline') {
            classpath files(takdevJar)
        }
    }
}

plugins {
    id 'com.android.application'
}

def atakVer = rootProject.ext.atakVersion
if (atakVer.toString().startsWith('4.')) {
    throw new GradleException("ATAK ${atakVer} uses the legacy transapps plugin model, which this source no longer " +
            "implements. Check out tag v1.0.0-civ4.6.0 (commit fc397d0) to build for ATAK 4.x.")
}
def atakSdkMode = takdevMode == 'none' ? 'stubs' : "takdev-${takdevMode}"
logger.lifecycle("BTL RCKT: ATAK ${atakVer} - SDK via '${atakSdkMode}'")
if (takdevMode == 'none') {
    if (!project.hasProperty('allowStubs')) {
        throw new GradleException("No ATAK SDK source. Pass -Ptakrepo.url / -Ptakrepo.user / -Ptakrepo.password " +
                "(artifacts.tak.gov), or copy atak-gradle-takdev.jar, main.jar and android_keystore from the " +
                "ATAK-CIV ${atakVer} SDK zip into sdk/${atakVer}/, or pass -PallowStubs (compile check only).")
    }
} else {
    // takdev offline mode reads main.jar / android_keystore / mapping.txt from sdk.path
    if (takdevMode == 'offline' && !project.hasProperty('sdk.path')) {
        project.ext.set('sdk.path', rootProject.file("sdk/${atakVer}").absolutePath)
    }
    // takdev reads these template-named properties
    project.ext.ATAK_VERSION = atakVer.toString()
    project.ext.PLUGIN_VERSION = rootProject.ext.pluginVersionName.toString()
    apply plugin: 'atak-takdev-plugin'
}

// ---------------------------------------------------------------------------
// Signing
//   debug   : local debug keystore (developer ATAK builds only).
//   release : YOUR key, never a debug / SDK development key. Read from keystore.properties
//             (git-ignored) or env vars BTLRCKT_KEYSTORE / BTLRCKT_KEYSTORE_PASSWORD /
//             BTLRCKT_KEY_ALIAS / BTLRCKT_KEY_PASSWORD. If none is configured the release APK is
//             left UNSIGNED; the TAK.gov third-party pipeline signs it.
// ---------------------------------------------------------------------------
def loadProps = { String name ->
    def p = new Properties(); def f = rootProject.file(name)
    if (f.exists()) { f.withInputStream { p.load(it) } }
    return p
}
def localProps = loadProps('local.properties')
def ksProps = loadProps('keystore.properties')
def prop = { String key, String dflt -> localProps.getProperty(key, dflt) }
def rel = { String key, String env -> ksProps.getProperty(key) ?: System.getenv(env) }
def relStore = rel('storeFile', 'BTLRCKT_KEYSTORE')
def hasReleaseKey = relStore != null && rootProject.file(relStore).exists()
if (relStore != null && !hasReleaseKey) {
    throw new GradleException("Release keystore not found: ${relStore}")
}
if (hasReleaseKey && ['debug.keystore', 'android_keystore'].contains(rootProject.file(relStore).name)) {
    throw new GradleException('Refusing to sign a release build with a debug / SDK development keystore')
}

android {
    namespace 'com.btlrckt.bottlerocket'
    compileSdk 34

    defaultConfig {
        applicationId 'com.btlrckt.bottlerocket'
        minSdk 21
        targetSdk 34
        versionCode rootProject.ext.pluginVersionCode
        versionName rootProject.ext.pluginVersionName
        buildConfigField 'String', 'ATAK_SDK_MODE', "\"${atakSdkMode}\""
        buildConfigField 'String', 'ATAK_VERSION', "\"${atakVer}\""
    }

    signingConfigs {
        debug {
            storeFile rootProject.file(prop('takDebugKeyFile', 'keystores/debug.keystore'))
            storePassword prop('takDebugKeyFilePassword', 'android')
            keyAlias prop('takDebugKeyAlias', 'androiddebugkey')
            keyPassword prop('takDebugKeyPassword', 'android')
        }
        if (hasReleaseKey) {
            release {
                storeFile rootProject.file(relStore)
                storePassword rel('storePassword', 'BTLRCKT_KEYSTORE_PASSWORD')
                keyAlias rel('keyAlias', 'BTLRCKT_KEY_ALIAS')
                keyPassword rel('keyPassword', 'BTLRCKT_KEY_PASSWORD') ?: rel('storePassword', 'BTLRCKT_KEYSTORE_PASSWORD')
                enableV1Signing true
                enableV2Signing true
            }
        }
    }

    // Same flavour layout as the TAK 5.6.0 plugin template. Each flavour stamps the plugin-api
    // string ATAK checks, e.g. com.atakmap.app@5.6.0.CIV. Per the template, gov uses the CIV API
    // and gets its own application id suffix.
    flavorDimensions = ['application']
    productFlavors {
        civ { dimension 'application'; manifestPlaceholders = [atakApiVersion: "com.atakmap.app@${atakVer}.CIV"] }
        mil { dimension 'application'; manifestPlaceholders = [atakApiVersion: "com.atakmap.app@${atakVer}.MIL"] }
        gov {
            dimension 'application'
            applicationIdSuffix '.gov'
            manifestPlaceholders = [atakApiVersion: "com.atakmap.app@${atakVer}.CIV"]
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            debuggable true
            matchingFallbacks = ['sdk']
        }
        release {
            signingConfig hasReleaseKey ? signingConfigs.release : null
            // Obfuscated against the ATAK mapping (proguard-gradle.txt = SDK template system rules);
            // proguard-gradle-repackage.txt is generated below for crash-log identification.
            minifyEnabled true
            proguardFiles 'proguard-gradle.txt', 'proguard-gradle-repackage.txt', 'proguard-rules.pro'
            matchingFallbacks = ['odk']
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        disable 'MissingClass'
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    // Required by the 5.6.0 template: TAK's inner signing check fails if the store archive is on
    bundle {
        storeArchive {
            enable = false
        }
    }

    packaging {
        // Required by the 5.6.0 template so native libraries can load inside ATAK
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes += ['META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/DEPENDENCIES', 'META-INF/INDEX.LIST']
        }
    }
}

// Crash-log identification: obfuscated plugin classes are repackaged under atakplugin.btlrckt
// (replaces the template's "-repackageclasses atakplugin.PluginTemplate").
afterEvaluate {
    project.file('proguard-gradle-repackage.txt').text = "-repackageclasses atakplugin.${rootProject.name}"
}

dependencies {
    // The ATAK SDK (compileOnly, provided by ATAK at runtime) is added by atak-gradle-takdev.
    // Unit tests always run against the JVM stubs.
    if (takdevMode == 'none') {
        compileOnly project(':atak-sdk-stubs')
    }
    testImplementation project(':atak-sdk-stubs')

    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.apache.commons:commons-lang3:3.12.0'

    testImplementation 'junit:junit:4.13.2'
}
