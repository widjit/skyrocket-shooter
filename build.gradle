// Top-level build file for the SKY ROCKET SHOOTER ATAK plugin.
plugins {
    id 'com.android.application' version '8.2.2' apply false
    id 'com.android.library' version '8.2.2' apply false
}

ext {
    // ATAK host version this plugin is built against. Must EXACTLY match the
    // major.minor.patch + flavour of the ATAK install on the device, or ATAK
    // refuses to load the plugin. Default = public CivTAK SDK 4.6.0.5 (GitHub).
    // Override for another host, e.g. ./gradlew assembleDebug -PatakVersion=5.4.0 -PatakFlavor=CIV
    atakVersion = project.findProperty('atakVersion') ?: '4.6.0'
    atakFlavor = project.findProperty('atakFlavor') ?: 'CIV'
    atakApiVersion = "com.atakmap.app@${atakVersion}.${atakFlavor}" // informational; per-flavour value is set in app/build.gradle
    pluginVersionName = '1.0.0'
    pluginVersionCode = 1
}
