#    com.atakmap.app:ATAK:4.8.0.0:sdk@aar from a TAK Maven repository
# 3) Otherwise the bundled :atak-sdk-stubs module is used (compile-only, CI / dev builds)
#atakSdkMaven=true
#takRepoUrl=https://artifacts.tak.gov/artifactory/maven
