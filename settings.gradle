pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        // Optional private TAK Maven repository (only needed when building with -PatakSdkMaven=true).
        if (providers.gradleProperty('takRepoUrl').isPresent()) {
            maven {
                url providers.gradleProperty('takRepoUrl').get()
                if (providers.gradleProperty('takRepoUser').isPresent()) {
                    credentials {
                        username providers.gradleProperty('takRepoUser').get()
                        password providers.gradleProperty('takRepoPassword').getOrElse('')
                    }
                }
            }
        }
    }
}

rootProject.name = 'btlrckt'
include ':app'
// JVM mirror of the ATAK 5.x API surface used by this plugin. Always used by the unit tests;
// used for APK compilation only with -PallowStubs (compile check, not a runnable APK).
include ':atak-sdk-stubs'
